services:
  database:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: nutriflow
      POSTGRES_USER: nutriflow
      POSTGRES_PASSWORD: nutriflow_dev
    ports:
      - "5432:5432"
    volumes:
      - nutriflow_pgdata:/var/lib/postgresql/data

volumes:
  nutriflow_pgdata: